[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ec50-panel"
version = "1.0.0"
description = "Driver for the Barco EC-50 Event Controller's USB control surface"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jayden Nawotka" }]
requires-python = ">=3.9"
keywords = ["barco", "ec-50", "event-master", "ftdi", "control-surface", "companion", "emulator"]
urls = { Homepage = "https://github.com/qubered/ec50-panel" }
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Video",
    "Topic :: System :: Hardware :: Hardware Drivers",
]

[project.optional-dependencies]
windows = ["ftd2xx"]
posix = ["pyftdi"]

[project.scripts]
ec50 = "ec50.cli:main"

[tool.setuptools.packages.find]
include = ["ec50*"]

[tool.setuptools.package-data]
"ec50.emulator" = ["web/*.html", "web/*.css", "web/*.js"]
